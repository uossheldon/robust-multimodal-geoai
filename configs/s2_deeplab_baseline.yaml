name: s2_deeplab_baseline
split: configs/split_v1.yaml
manifest: results/tile_manifest.csv
num_classes: 4
ignore_index: 255
tile_size: 224
batch_size: 2
num_workers: 0
epochs: 2
seed: 42
train_subset_tiles: 8
validation_subset_tiles: 4
mixed_precision: true
model:
  architecture: deeplabv3_mobilenet_v3_large
  weights: DEFAULT
  backbone_lr: 0.00001
  classifier_lr: 0.0001
  weight_decay: 0.001
normalization:
  input_scale: 10000.0
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

