name: Lightweight repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile sources and check paths, splits and saved evidence
        run: python scripts/check_lightweight.py
      - name: Verify presentation and static-only artifact
        run: python scripts/check_presentation.py
